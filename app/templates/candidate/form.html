{% extends "base.html" %}

{% block content %}

<h2 style="text-align:center;">
    {{ "Edit Candidate" if candidate else "New Candidate" }}
</h2>

<form method="POST" style="max-width:800px; margin:0 auto;">

    <!-- ROW 1 -->
    <div style="display:flex; gap:15px; flex-wrap:wrap; margin-bottom:15px;">

        <div>
            <label>Name <span style="color:red">*</span></label><br>
            <input type="text" name="name" size="65" required value="{{ candidate.NAME if candidate else '' }}">
        </div>

        <div>
            <label>Date of Birth <span style="color:red">*</span></label><br>
            <input type="date" name="date_birth" required value="{{ candidate.DATE_BIRTH if candidate else '' }}">
        </div>

        <div>
            <label>Gender <span style="color:red">*</span></label><br>
            <select name="gender" required style="width: 131px; margin-right: 15px;">

                <option value="" {% if not candidate %}selected{% endif %}></option>

                <option value="F" {% if candidate and candidate.GENDER=='F' %}selected{% endif %}>
                    Female
                </option>

                <option value="M" {% if candidate and candidate.GENDER=='M' %}selected{% endif %}>
                    Male
                </option>

                <option value="U" {% if candidate and candidate.GENDER=='U' %}selected{% endif %}>
                    Unspecified
                </option>

            </select>
        </div>

    </div>

    <!-- ROW 2 -->
    <div style="display:flex; gap:15px; flex-wrap:wrap; margin-bottom:15px;">

        <div>
            <label>Phone <span style="color:red">*</span></label><br>
            <input type="text" name="phone" size="34" required value="{{ candidate.PHONE if candidate else '' }}">
        </div>

        <div>
            <label>Email <span style="color:red">*</span></label><br>
            <input type="email" name="email" size="65" required value="{{ candidate.EMAIL if candidate else '' }}">
        </div>

    </div>

    <!-- ROW 3 -->
    <div style="display:flex; gap:15px; flex-wrap:wrap; margin-bottom:15px;">

        <div>
            <label>Address</label><br>
            <input type="text" name="address" size="44" value="{{ candidate.ADDRESS if candidate else '' }}">
        </div>

        <div>
            <label>City</label><br>
            <input type="text" name="city" size="20" value="{{ candidate.CITY if candidate else '' }}">
        </div>

        <div>
            <label>Country</label><br>
            <select name="country">

                <option value=""></option>

                {% for country in countries %}
                <option value="{{ country.ID }}" {% if candidate and candidate.COUNTRY==country.ID %}selected{% endif
                    %}>
                    {{ country.NAME }}
                </option>
                {% endfor %}

            </select>
        </div>

    </div>

    <!-- ROW 4 -->
    <div style="margin-bottom:20px;">
        <label>LinkedIn</label><br>
        <input type="text" name="linkedin" size="108" value="{{ candidate.LINKEDIN if candidate else '' }}">
    </div>

    <!-- ROW 5 -->
    <div style="margin-bottom:20px;">
        <label>Cover Letter</label><br>
        <textarea name="cover_letter" rows="20" cols="106">{{ candidate.COVER_LETTER if candidate else '' }}</textarea>
    </div>

    <!-- ACTIONS -->
    <div style="display:flex; justify-content:space-between; margin-top:20px;">

        <!-- Cancel -->
        {% if candidate %}
        <button type="button"
            onclick="window.location.href='{{ url_for('candidate_routes.view_candidate', id=candidate.ID) }}'"
            style="background-color: rgb(124, 0, 0); color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer;">
            Cancel
        </button>
        {% else %}
        <button type="button" onclick="window.location.href='{{ url_for('candidate_routes.list_candidates') }}'"
            style="background-color: rgb(124, 0, 0); color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer;">
            Cancel
        </button>
        {% endif %}

        <!-- Save -->
        <button type="submit"
            style="background-color: rgb(21, 124, 0); color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer;">
            Save
        </button>

    </div>

</form>

{% endblock %}
